[vars]
# The toolchain rpath SwiftPM adds by default points at wherever Swift lives on
# the build machine, which nobody else has. Replace it with the conventional
# install location so released binaries run on any machine with a toolchain.
swift_release_args = "-Xswiftc -gnone -Xcc -g0 -Xswiftc -use-ld=lld -Xlinker -T -Xlinker Scripts/discard-swift-modhash.ld -Xlinker -x -Xswiftc -no-toolchain-stdlib-rpath -Xlinker -rpath -Xlinker /usr/lib/swift/linux"
